# Supabase CLI configuration for LOCAL development (`supabase start`).
# Production settings are made in the Supabase dashboard — see docs/DEPLOYMENT.md.
project_id = "discharge-summary-pro"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/reset.html", "http://localhost:5173/reset.html"]
jwt_expiry = 3600
# Public self-registration is OFF: accounts are created by invitation only.
enable_signup = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[functions.admin-users]
verify_jwt = true
